<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Repository Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        #container { display: flex; height: 100vh; overflow: hidden; }

        /* ── Resize handles ── */
        .resizer {
            width: 5px;
            flex-shrink: 0;
            cursor: col-resize;
            background: #ddd;
            transition: background 0.15s;
            z-index: 10;
            position: relative;
        }
        .resizer:hover, .resizer.dragging { background: #4a90e2; }

        /* ── Panel base ── */
        .panel {
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            min-width: 28px;
        }

        .panel.collapsed { width: 28px !important; }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 10px 8px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            gap: 6px;
        }

        .panel-header h2 {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .panel-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
            line-height: 1;
        }
        .panel-toggle:hover { background: rgba(0,0,0,0.08); color: #333; }

        .panel-body { flex: 1; overflow: auto; padding: 12px; }
        #right-panel .panel-body { overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

        /* Collapsed state: show only toggle + rotated label */
        .panel.collapsed .panel-header {
            flex-direction: column-reverse;
            padding: 6px 4px;
            border-bottom: none;
            height: 100%;
            justify-content: flex-end;
            align-items: center;
        }
        .panel.collapsed .panel-header h2 {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 11px;
            overflow: visible;
            text-overflow: clip;
            flex: 1;
            margin-top: 6px;
        }
        .panel.collapsed .panel-body { display: none; }
        .panel.collapsed #code-file-label { display: none; }

        /* ── Left panel ── */
        #left-panel { width: 250px; background: #f8f9fa; }

        /* ── Code panel ── */
        #code-panel { width: 500px; background: #1e1e1e; color: #d4d4d4; }
        #code-panel .panel-header { background: #252526; border-bottom-color: #3c3c3c; }
        #code-panel .panel-header h2 { color: #9cdcfe; font-size: 13px; }
        #code-panel .panel-toggle { color: #777; }
        #code-panel .panel-toggle:hover { background: rgba(255,255,255,0.08); color: #ccc; }

        #code-file-label {
            color: #888;
            font-size: 11px;
            padding: 3px 12px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
        }

        #code-panel .panel-body {
            padding: 0;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
        }

        #code-viewer {
            padding: 8px 0 16px;
            white-space: pre;
            line-height: 1.5;
        }

        .code-line { display: block; }
        .code-line-num {
            color: #555;
            user-select: none;
            display: inline-block;
            width: 3.5em;
            text-align: right;
            margin-right: 12px;
            padding-right: 4px;
            border-right: 1px solid #333;
        }
        .code-highlight-line { background: #264f78; display: block; }

        /* ── Center panel ── */
        #center-panel { flex: 1; background: white; min-width: 150px; }

        /* ── Right panel ── */
        #right-panel { width: 350px; background: #fafbfc; }

        /* ── Tree ── */
        .tree-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 4px;
            margin: 1px 0;
            user-select: none;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
        }
        .tree-item:hover { background: #e8eaed; }
        .tree-item.active { background: #4a90e2; color: white; }
        .tree-item.active .tree-icon-folder,
        .tree-item.active .tree-icon-file,
        .tree-item.active .tree-icon-repo { color: white; }

        .tree-toggle {
            width: 14px;
            flex-shrink: 0;
            color: #bbb;
            font-size: 10px;
            text-align: center;
            line-height: 1;
        }
        .tree-toggle:hover { color: #555; }
        .tree-toggle.has-children { cursor: pointer; }

        .tree-icon { flex-shrink: 0; font-size: 13px; line-height: 1; }
        .tree-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .tree-icon-repo   { color: #FFB300; }
        .tree-icon-folder { color: #4a90e2; }
        .tree-icon-file-py  { color: #3572A5; }
        .tree-icon-file-js  { color: #f1e05a; }
        .tree-icon-file-ts  { color: #2b7489; }
        .tree-icon-file     { color: #52C41A; }

        .tree-children { display: none; }
        .tree-children.expanded { display: block; }

        /* ── Center panel tabs ── */
        .center-tabs {
            display: flex;
            gap: 2px;
            padding: 4px 8px 0;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            background: white;
        }
        .center-tab {
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            border: 1px solid transparent;
            border-bottom: none;
            margin-bottom: -1px;
            background: transparent;
        }
        .center-tab:hover { color: #444; }
        .center-tab.active { color: #3b5bdb; border-color: #e0e0e0; background: white; }

        /* ── Graph ── */
        #graph-container { width: 100%; height: 100%; background: white; }

        /* ── Mermaid diagram ── */
        #mermaid-container {
            display: none;
            width: 100%;
            height: 100%;
            overflow: auto;
            background: white;
            padding: 16px;
            align-items: flex-start;
            justify-content: center;
        }
        #mermaid-container.active { display: flex; }
        #mermaid-output { min-width: 300px; }
        #mermaid-placeholder { color: #aaa; font-size: 13px; font-style: italic; padding: 32px; }

        /* ── Node detail ── */
        #detail-pane { display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; max-height: 55%; }

        .nd-breadcrumb {
            font-size: 11px;
            color: #999;
            padding: 6px 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .nd-breadcrumb span { color: #bbb; margin: 0 3px; }

        .nd-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .nd-name { font-size: 15px; font-weight: 600; color: #222; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nd-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }
        .nd-badge.type-function { background: #e8f0fe; color: #3b5bdb; }
        .nd-badge.type-class    { background: #fff0eb; color: #d04010; }
        .nd-badge.type-file     { background: #e6f7ee; color: #1a7a3e; }
        .nd-badge.type-folder   { background: #fff8e1; color: #b07d00; }
        .nd-badge.type-repo     { background: #f3f0ff; color: #6741d9; }
        .nd-badge.type-other    { background: #f0f0f0; color: #666; }

        /* Tabs */
        .nd-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .nd-tab {
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            border: 1px solid transparent;
            border-bottom: none;
            margin-bottom: -1px;
            background: transparent;
            transition: color 0.12s;
        }
        .nd-tab:hover { color: #444; }
        .nd-tab.active { color: #3b5bdb; border-color: #e0e0e0; background: #fafbfc; }

        .nd-tab-panel { display: none; overflow-y: auto; flex: 1; min-height: 0; }
        .nd-tab-panel.active { display: flex; flex-direction: column; }

        /* Info tab */
        .nd-sig-card {
            background: #f6f8ff;
            border: 1px solid #dde3f5;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .nd-sig-fn {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            color: #3b5bdb;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .nd-params-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .nd-params-table th { text-align: left; color: #999; font-weight: 500; font-size: 10px; text-transform: uppercase; padding: 2px 4px 4px; letter-spacing: 0.05em; }
        .nd-params-table td { padding: 2px 4px; vertical-align: top; }
        .nd-params-table tr:nth-child(even) td { background: rgba(0,0,0,0.02); }
        .nd-param-name { font-family: 'Monaco', 'Menlo', monospace; color: #222; }
        .nd-param-type { color: #666; font-style: italic; }
        .nd-return-row { margin-top: 8px; font-size: 12px; color: #555; }
        .nd-return-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; font-family: monospace; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }

        .nd-section-label { font-size: 10px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 4px; }
        .nd-docstring {
            font-size: 12px;
            color: #555;
            line-height: 1.6;
            background: #fafafa;
            border-left: 3px solid #dde3f5;
            padding: 6px 10px;
            border-radius: 0 4px 4px 0;
            white-space: pre-wrap;
        }
        .nd-summary { font-size: 13px; color: #444; line-height: 1.6; }
        .nd-explain-body { font-size: 13px; color: #333; line-height: 1.65; }
        .nd-explain-body h2 { font-size: 13px; font-weight: 700; margin: 10px 0 4px; color: #222; }
        .nd-explain-body ul { padding-left: 18px; margin: 4px 0 8px; }
        .nd-explain-body li { margin-bottom: 4px; }
        .nd-explain-body code { background: #f0f0f0; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
        .nd-explain-body strong { color: #1a6fb5; }
        .nd-mermaid-wrap { margin: 10px 0; overflow-x: auto; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 6px; padding: 12px; text-align: center; cursor: zoom-in; position: relative; }
        .nd-mermaid-wrap:hover { border-color: #4a90e2; }
        .nd-mermaid-wrap svg { max-width: 100%; height: auto; pointer-events: none; }
        .nd-mermaid-zoom-hint { position: absolute; top: 5px; right: 7px; font-size: 10px; color: #aaa; pointer-events: none; }
        /* Mermaid zoom modal */
        #mermaid-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.65); align-items: center; justify-content: center; }
        #mermaid-modal.open { display: flex; }
        #mermaid-modal-box { background: #fff; border-radius: 10px; width: 90vw; height: 88vh; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
        #mermaid-modal-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #eee; flex-shrink: 0; }
        #mermaid-modal-toolbar button { border: 1px solid #ccc; background: #f7f7f7; border-radius: 4px; cursor: pointer; font-size: 13px; padding: 3px 9px; line-height: 1; color: #333; }
        #mermaid-modal-toolbar button:hover { background: #ececec; }
        #mermaid-zoom-level { font-size: 12px; color: #666; min-width: 42px; text-align: center; }
        #mermaid-modal-close { margin-left: auto; font-size: 16px; }
        #mermaid-modal-scroll { flex: 1; overflow: hidden; position: relative; cursor: grab; background: #fff; }
        #mermaid-modal-scroll.grabbing { cursor: grabbing; }
        #mermaid-modal-content { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        #mermaid-modal-content svg { display: block; }
        /* Explain All accordion */
        .explain-all-btn { font-size: 12px; padding: 4px 10px; border: 1px solid #4a90e2; border-radius: 4px; background: #eaf3ff; color: #1a6fb5; cursor: pointer; }
        .explain-all-btn:hover:not(:disabled) { background: #d0e8ff; }
        .explain-all-btn:disabled { opacity: 0.5; cursor: default; }
        .ea-item { border: 1px solid #e4e4e4; border-radius: 5px; margin-bottom: 6px; overflow: hidden; }
        .ea-header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #f5f7fa; cursor: pointer; user-select: none; }
        .ea-header:hover { background: #eaf0fb; }
        .ea-toggle { font-size: 10px; color: #888; flex-shrink: 0; }
        .ea-name { font-size: 12px; font-weight: 600; color: #333; }
        .ea-body { padding: 10px 12px; border-top: 1px solid #e4e4e4; }
        /* Explain cache toolbar */
        .nd-explain-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .nd-cache-tag { font-size: 11px; color: #2e7d32; background: #eaf7ea; border: 1px solid #cce8cc; border-radius: 10px; padding: 1px 8px; }
        .nd-regen-btn { margin-left: auto; font-size: 11px; padding: 2px 8px; border: 1px solid #ccc; border-radius: 4px; background: #f7f7f7; color: #555; cursor: pointer; }
        .nd-regen-btn:hover { background: #ececec; color: #222; }

        /* Refs tab */
        .nd-ref-list { list-style: none; padding: 0; margin: 0; }
        .nd-ref-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .nd-ref-item:hover { background: #f0f4ff; }
        .nd-ref-badge { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; flex-shrink: 0; }
        .nd-ref-badge.calls    { background: #fff0eb; color: #d04010; }
        .nd-ref-badge.calledby { background: #e8f0fe; color: #3b5bdb; }
        .nd-ref-badge.imports  { background: #f3f0ff; color: #6741d9; }
        .nd-ref-badge.inherits { background: #e6f7ee; color: #1a7a3e; }
        .nd-ref-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
        .nd-empty { color: #bbb; font-size: 12px; font-style: italic; padding: 8px 0; }

        /* ── Chat ── */
        #chat-section {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #e8e8e8;
            flex: 1;
            min-height: 0;
            padding-top: 10px;
            gap: 8px;
        }
        .chat-context-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }
        .chat-context-pill strong {
            background: #e8f0fe;
            color: #3b5bdb;
            padding: 1px 7px;
            border-radius: 10px;
            font-family: monospace;
            font-weight: 600;
            font-size: 11px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            padding-right: 2px;
        }
        .chat-msg {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-msg-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #aaa;
        }
        .chat-bubble {
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 100%;
            word-break: break-word;
        }
        .chat-bubble.user { background: #e8f0fe; color: #1a237e; align-self: flex-end; border-radius: 6px 6px 2px 6px; }
        .chat-bubble.ai { background: #f6f8fa; border: 1px solid #e0e0e0; color: #333; }
        .chat-bubble.ai p { margin: 0 0 6px; }
        .chat-bubble.ai p:last-child { margin-bottom: 0; }
        .chat-bubble.ai pre { background: #282c34; border-radius: 4px; padding: 8px; overflow-x: auto; margin: 6px 0; }
        .chat-bubble.ai code { font-size: 12px; }
        .chat-bubble.ai :not(pre) > code { background: #eee; padding: 1px 4px; border-radius: 3px; }
        .chat-bubble.ai ul, .chat-bubble.ai ol { padding-left: 20px; margin: 4px 0; }
        .chat-separator { text-align: center; font-size: 10px; color: #ccc; padding: 4px 0; letter-spacing: 0.04em; }
        .stream-cursor { display: inline-block; animation: blink 0.7s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .chat-quick-btns { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
        .chat-quick-btn {
            font-size: 11px;
            padding: 3px 9px;
            border: 1px solid #c5cae9;
            background: #f3f4ff;
            color: #3b5bdb;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .chat-quick-btn:hover { background: #dde3ff; }

        .chat-input-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
            border-top: 1px solid #e8e8e8;
            padding-top: 8px;
            background: #fafbfc;
        }
        .chat-input-row {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }
        .chat-input-row textarea {
            flex: 1;
            padding: 7px 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .chat-input-row textarea:focus { outline: none; border-color: #4a90e2; }
        .chat-send-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 7px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            align-self: flex-end;
        }
        .chat-send-btn:hover { background: #2563eb; }
        .chat-clear-btn {
            background: #f5f5f5;
            border: 1px solid #ddd;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            padding: 7px 11px;
            border-radius: 6px;
            white-space: nowrap;
            align-self: flex-end;
            line-height: 1;
        }
        .chat-clear-btn:hover { background: #ffe8e8; border-color: #f5c6cb; color: #c0392b; }

        /* ── Misc ── */
        .repo-selector { margin-bottom: 12px; }
        .repo-selector select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .button-group { margin: 8px 0; display: flex; gap: 8px; }
        .button-group button {
            flex: 1;
            padding: 8px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .button-group button:hover { background: #2563eb; }
        .loading { color: #888; font-style: italic; }
        h2 { font-size: 14px; margin-bottom: 8px; color: #333; }
        h3 { font-size: 13px; margin: 12px 0 8px 0; color: #444; }
        .filters {
            margin: 4px 0 8px;
            padding: 8px 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .filters label { display: block; font-size: 12px; margin: 3px 0; cursor: pointer; }
        .filters input[type="checkbox"] { margin-right: 4px; }

        /* ── Symbols panel ── */
        #symbols-panel { width: 220px; background: #f5f5f5; }

        .sym-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
        }
        .sym-item:hover { background: #e0e0e0; }
        .sym-item.active { background: #4a90e2; color: white; }

        .sym-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            flex-shrink: 0;
            font-family: sans-serif;
        }
        .sym-badge.cls  { background: #FF7A45; color: white; }
        .sym-badge.mth  { background: #9C27B0; color: white; }
        .sym-badge.fn   { background: #4a90e2; color: white; }

        .sym-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .sym-line { color: #aaa; font-size: 11px; flex-shrink: 0; }
        .sym-item.active .sym-line { color: rgba(255,255,255,0.7); }

        .sym-children { padding-left: 14px; }
        .sym-section-label {
            font-size: 10px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            padding: 8px 8px 3px;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div id="container">

        <!-- Left: Repository tree -->
        <div class="panel" id="left-panel">
            <div class="panel-header">
                <h2>Repository</h2>
                <button class="panel-toggle" onclick="togglePanel('left-panel')" title="Collapse">◀</button>
            </div>
            <div class="panel-body">
                <div class="repo-selector">
                    <select id="repo-select">
                        <option value="">-- Select Repo --</option>
                    </select>
                </div>
                <div class="button-group">
                    <button onclick="summarizeAll()">Summarize All</button>
                </div>
                <h2>Structure</h2>
                <div id="tree-container"></div>
            </div>
        </div>

        <div class="resizer" id="resizer-left-code"></div>

        <!-- Code Viewer -->
        <div class="panel" id="code-panel">
            <div class="panel-header">
                <h2>Code Viewer</h2>
                <button class="panel-toggle" onclick="togglePanel('code-panel')" title="Collapse">◀</button>
            </div>
            <div id="code-file-label">Select a node to view source</div>
            <div class="panel-body">
                <div id="code-viewer"></div>
            </div>
        </div>

        <div class="resizer" id="resizer-code-symbols"></div>

        <!-- Symbols -->
        <div class="panel" id="symbols-panel">
            <div class="panel-header">
                <h2>Symbols</h2>
                <button class="panel-toggle" onclick="togglePanel('symbols-panel')" title="Collapse">◀</button>
            </div>
            <div class="panel-body" id="symbols-body">
                <p class="loading">Open a file to see symbols</p>
            </div>
        </div>

        <div class="resizer" id="resizer-symbols-center"></div>

        <!-- Center: Knowledge graph / Diagram -->
        <div class="panel" id="center-panel">
            <div class="panel-header">
                <h2>Knowledge Graph</h2>
                <button class="panel-toggle" onclick="togglePanel('center-panel')" title="Collapse">◀</button>
            </div>
            <div class="center-tabs">
                <div class="center-tab active" id="tab-graph" onclick="switchCenterTab('graph')">Graph</div>
                <div class="center-tab" id="tab-diagram" onclick="switchCenterTab('diagram')">Diagram</div>
            </div>
            <div class="panel-body" style="padding: 8px; display: flex; flex-direction: column; padding-top: 4px;">
                <div id="graph-view" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                    <div class="filters">
                        <label><input type="checkbox" id="filter-contains" checked> Contains</label>
                        <label><input type="checkbox" id="filter-imports" checked> Imports</label>
                        <label><input type="checkbox" id="filter-calls" checked> Calls</label>
                        <label><input type="checkbox" id="filter-inherits" checked> Inherits</label>
                    </div>
                    <div id="graph-container" style="flex:1;"></div>
                </div>
                <div id="mermaid-container">
                    <div id="mermaid-placeholder">Load a repository to generate an architecture diagram.</div>
                    <div id="mermaid-output"></div>
                </div>
            </div>
        </div>

        <div class="resizer" id="resizer-center-right"></div>

        <!-- Right: Node details + Chat -->
        <div class="panel" id="right-panel">
            <div class="panel-header">
                <h2>Node Details</h2>
                <button class="panel-toggle" onclick="togglePanel('right-panel')" title="Collapse">▶</button>
            </div>
            <div class="panel-body">
                <div id="detail-pane">
                    <p class="loading">Select a node to view details</p>
                </div>
                <div id="chat-section" style="display:none;">
                    <div class="chat-context-pill">
                        Asking about <strong id="chat-context-name">—</strong>
                    </div>
                    <div class="chat-quick-btns">
                        <button class="chat-quick-btn" onclick="quickAsk('Explain what this does in plain English')">Explain</button>
                        <button class="chat-quick-btn" onclick="quickAsk('What are potential bugs or edge cases here?')">Find bugs</button>
                        <button class="chat-quick-btn" onclick="quickAsk('Show typical usage examples for this')">Usage</button>
                        <button class="chat-quick-btn" onclick="quickAsk('How could this be refactored or improved?')">Improve</button>
                    </div>
                    <div class="chat-thread" id="chat-thread"></div>
                    <div class="chat-input-area">
                        <div class="chat-input-row">
                            <textarea id="chat-input" placeholder="Ask about this node… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
                            <button class="chat-send-btn" onclick="chatSend()">Send</button>
                            <button class="chat-clear-btn" onclick="clearChat()" title="Clear chat history">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentGraph = null;
        let currentRepo = null;
        let currentNodeId = null;
        let visNetwork = null;
        let visNodes = null;
        let visEdges = null;

        // ── Panel collapse / expand ──────────────────────────────────────────
        const panelSavedWidths = {};
        const defaultWidths = { 'left-panel': 250, 'code-panel': 500, 'symbols-panel': 220, 'right-panel': 350 };

        function togglePanel(id) {
            const panel = document.getElementById(id);
            const btn = panel.querySelector('.panel-toggle');
            const isRight = id === 'right-panel';

            if (panel.classList.contains('collapsed')) {
                const w = panelSavedWidths[id] || defaultWidths[id] || 300;
                panel.style.width = w + 'px';
                panel.classList.remove('collapsed');
                btn.textContent = isRight ? '▶' : '◀';
                btn.title = 'Collapse';
            } else {
                panelSavedWidths[id] = panel.offsetWidth;
                panel.classList.add('collapsed');
                btn.textContent = isRight ? '◀' : '▶';
                btn.title = 'Expand';
            }
            notifyGraphResize();
        }

        // ── Resizers ─────────────────────────────────────────────────────────
        // Each resizer drags a single target panel's width.
        // center-panel is flex:1 so it absorbs the remaining space automatically.
        function initResizers() {
            makeDragResizer('resizer-left-code',      'left-panel',    1);
            makeDragResizer('resizer-code-symbols',   'code-panel',    1);
            makeDragResizer('resizer-symbols-center', 'symbols-panel', 1);
            makeDragResizer('resizer-center-right',   'right-panel',  -1);
        }

        function makeDragResizer(resizerId, targetId, direction) {
            const resizer = document.getElementById(resizerId);
            resizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const panel = document.getElementById(targetId);
                const startX = e.clientX;
                const startW = panel.offsetWidth;
                resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';

                function onMove(e) {
                    const dx = (e.clientX - startX) * direction;
                    const newW = Math.max(28, startW + dx);
                    panel.style.width = newW + 'px';
                    if (newW > 60 && panel.classList.contains('collapsed')) {
                        panel.classList.remove('collapsed');
                        const btn = panel.querySelector('.panel-toggle');
                        btn.textContent = targetId === 'right-panel' ? '▶' : '◀';
                        btn.title = 'Collapse';
                    }
                }

                function onUp() {
                    resizer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    notifyGraphResize();
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        function notifyGraphResize() {
            if (visNetwork) setTimeout(() => visNetwork.fit(), 60);
        }

        // ── Repo loading ─────────────────────────────────────────────────────
        async function loadRepos() {
            try {
                const resp = await fetch("/api/repos");
                const data = await resp.json();
                const select = document.getElementById("repo-select");
                data.repos.forEach(repo => {
                    const opt = document.createElement("option");
                    opt.value = repo;
                    opt.textContent = repo;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load repos:", e);
            }
        }

        async function loadRepo(repoName) {
            try {
                const resp = await fetch(`/api/load-repo/${repoName}`, { method: "POST" });
                if (!resp.ok) throw new Error("Failed to load repo");

                currentRepo = repoName;

                const [graphResp, summaryResp] = await Promise.all([
                    fetch("/api/graph"),
                    fetch("/api/summary"),
                    fetch("/api/highlights")
                ]);

                currentGraph = await graphResp.json();
                const summary = await summaryResp.json();

                renderTree(summary.tree);
                renderGraph(currentGraph);
            } catch (e) {
                console.error("Failed to load repo:", e);
                alert("Failed to load repository: " + e.message);
            }
        }

        // ── Tree ─────────────────────────────────────────────────────────────
        const TREE_ICONS = {
            repo:   { icon: '⬡', cls: 'tree-icon-repo' },
            folder: { icon: '📁', cls: 'tree-icon-folder' },
            file:   { icon: '📄', cls: 'tree-icon-file' },
        };

        function fileIconClass(name) {
            if (!name) return 'tree-icon-file';
            const ext = name.split('.').pop().toLowerCase();
            if (ext === 'py')  return 'tree-icon-file-py';
            if (ext === 'js' || ext === 'jsx') return 'tree-icon-file-js';
            if (ext === 'ts' || ext === 'tsx') return 'tree-icon-file-ts';
            return 'tree-icon-file';
        }

        function renderTree(node, container = null, depth = 0) {
            // Only render repo, folder, file nodes
            const ALLOWED = new Set(['repo', 'folder', 'file']);
            if (!ALLOWED.has(node.type)) return;

            if (!container) {
                container = document.getElementById("tree-container");
                container.innerHTML = "";
            }

            // Filter children to only file-system nodes
            const visibleChildren = (node.children || []).filter(c => ALLOWED.has(c.type));

            const row = document.createElement("div");
            row.className = "tree-item";
            row.style.marginLeft = (depth * 16) + "px";
            row.dataset.nodeId = node.id;

            // Toggle arrow (only if has visible children)
            const toggle = document.createElement("span");
            toggle.className = "tree-toggle";
            if (visibleChildren.length > 0) {
                toggle.classList.add('has-children');
                toggle.textContent = "▶";
            }
            row.appendChild(toggle);

            // Icon
            const icon = document.createElement("span");
            icon.className = "tree-icon";
            if (node.type === 'file') {
                icon.textContent = "📄";
                icon.className += " " + fileIconClass(node.name);
            } else if (node.type === 'folder') {
                icon.textContent = "📁";
                icon.className += " tree-icon-folder";
            } else {
                icon.textContent = "⬡";
                icon.className += " tree-icon-repo";
            }
            row.appendChild(icon);

            // Label
            const label = document.createElement("span");
            label.className = "tree-label";
            label.textContent = node.name;
            row.appendChild(label);

            // Click row → select node
            row.addEventListener("click", (e) => {
                e.stopPropagation();
                selectNode(node.id);
            });

            container.appendChild(row);

            // Children container
            if (visibleChildren.length > 0) {
                const childrenDiv = document.createElement("div");
                childrenDiv.className = "tree-children";
                container.appendChild(childrenDiv);

                // Toggle expand/collapse
                toggle.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const expanded = childrenDiv.classList.toggle("expanded");
                    toggle.textContent = expanded ? "▼" : "▶";
                    // Auto-open folder icon
                    if (node.type === 'folder') icon.textContent = expanded ? "📂" : "📁";
                });

                visibleChildren.forEach(child => renderTree(child, childrenDiv, depth + 1));
            }
        }

        // ── Graph ─────────────────────────────────────────────────────────────
        function renderGraph(graph) {
            if (!visNetwork) {
                visNodes = new vis.DataSet();
                visEdges = new vis.DataSet();
                const container = document.getElementById("graph-container");
                const options = {
                    physics: { enabled: true, barnesHut: { gravitationalConstant: -30000 } },
                    nodes: { shape: "dot", font: { size: 12 } },
                    edges: { font: { size: 10 }, arrows: { to: { enabled: true } } }
                };
                visNetwork = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);
                visNetwork.on("click", (params) => {
                    if (params.nodes.length > 0) selectNode(params.nodes[0]);
                });
            }

            const colorMap = {
                repo: "#FFD700", folder: "#4a90e2", file: "#52C41A",
                class: "#FF7A45", function: "#999999"
            };

            visNodes.clear();
            visEdges.clear();

            graph.nodes.forEach(node => {
                visNodes.add({ id: node.id, label: node.name, color: colorMap[node.type] || "#999999", title: `${node.type}: ${node.name}` });
            });

            const filters = {
                contains: document.getElementById("filter-contains").checked,
                imports: document.getElementById("filter-imports").checked,
                calls: document.getElementById("filter-calls").checked,
                inherits: document.getElementById("filter-inherits").checked
            };

            graph.edges.forEach(edge => {
                if (filters[edge.rel]) {
                    visEdges.add({
                        from: edge.source, to: edge.target, label: edge.rel, title: edge.rel,
                        color: edge.rel === "contains" ? "#ccc" : edge.rel === "imports" ? "#4a90e2" :
                               edge.rel === "calls" ? "#FF7A45" : "#9C27B0"
                    });
                }
            });

            visNetwork.fit();
        }

        // ── Node selection ────────────────────────────────────────────────────
        async function selectNode(nodeId) {
            currentNodeId = nodeId;
            document.querySelectorAll(".tree-item.active").forEach(el => el.classList.remove("active"));

            loadSourceCode(nodeId);
            highlightActiveSymbol(nodeId);
            try {
                const resp = await fetch(`/api/node/${nodeId}`);
                if (!resp.ok) throw new Error("Node not found");
                const node = await resp.json();
                displayNodeDetail(node);
            } catch (e) {
                console.error("Failed to load node:", e);
            }
        }

        function displayNodeDetail(node) {
            const pane = document.getElementById("detail-pane");

            // Breadcrumb from node id (e.g. "repo::file.py::ClassName::method")
            const parts = node.id ? node.id.split("::") : [node.name];
            const breadcrumb = parts.map((p, i) =>
                i < parts.length - 1
                    ? `<span class="nd-crumb" style="cursor:pointer;color:#888;" title="${escapeHtml(p)}">${escapeHtml(p)}</span><span>›</span>`
                    : `<span style="color:#555;">${escapeHtml(p)}</span>`
            ).join(" ");

            const badgeCls = `type-${['function','class','file','folder','repo'].includes(node.type) ? node.type : 'other'}`;

            // Build Info tab
            let infoHtml = '';

            if (node.type === 'function' && node.metadata) {
                const args = node.metadata.args || [];
                const argStr = args.map(a => escapeHtml(a.name) + (a.annotation ? `: ${escapeHtml(a.annotation)}` : '')).join(', ');
                infoHtml += `<div class="nd-sig-card">
                    <div class="nd-sig-fn">def ${escapeHtml(node.name)}(${argStr})</div>`;
                if (args.length) {
                    infoHtml += `<table class="nd-params-table">
                        <tr><th>Param</th><th>Type</th></tr>
                        ${args.map(a => `<tr><td class="nd-param-name">${escapeHtml(a.name)}</td><td class="nd-param-type">${escapeHtml(a.annotation || '—')}</td></tr>`).join('')}
                    </table>`;
                }
                if (node.metadata.returns) {
                    infoHtml += `<div class="nd-return-row">Returns <span class="nd-return-badge">${escapeHtml(node.metadata.returns)}</span></div>`;
                }
                infoHtml += `</div>`;
            }

            if (node.metadata && node.metadata.docstring) {
                infoHtml += `<div class="nd-section-label">Docstring</div>
                    <div class="nd-docstring">${escapeHtml(node.metadata.docstring)}</div>`;
            }

            if (node.metadata && node.metadata.file) {
                infoHtml += `<div class="nd-section-label">Location</div>
                    <div style="font-size:12px;color:#666;font-family:monospace;">${escapeHtml(node.metadata.file)}${node.metadata.lineno ? ' : ' + node.metadata.lineno : ''}</div>`;
            }

            if (!infoHtml) infoHtml = `<p class="nd-empty">No metadata available for this node.</p>`;

            // Summary tab
            const summaryHtml = node.summary
                ? `<div class="nd-summary">${escapeHtml(node.summary)}</div>`
                : `<p class="nd-empty">No summary yet. Use "Summarize All" to generate.</p>`;

            // Refs tab — callers/callees from graph edges
            let refsHtml = '';
            if (currentGraph) {
                const callees = currentGraph.edges
                    .filter(e => e.source === node.id && e.rel === 'calls')
                    .map(e => ({ id: e.target, label: 'calls' }));
                const callers = currentGraph.edges
                    .filter(e => e.target === node.id && e.rel === 'calls')
                    .map(e => ({ id: e.source, label: 'calledby' }));
                const imports = currentGraph.edges
                    .filter(e => e.source === node.id && e.rel === 'imports')
                    .map(e => ({ id: e.target, label: 'imports' }));
                const inherits = currentGraph.edges
                    .filter(e => e.source === node.id && e.rel === 'inherits')
                    .map(e => ({ id: e.target, label: 'inherits' }));

                const all = [...callers, ...callees, ...imports, ...inherits];
                if (all.length) {
                    refsHtml = `<ul class="nd-ref-list">${all.map(r => {
                        const name = r.id.split('::').pop();
                        return `<li class="nd-ref-item" onclick="selectNode('${escapeHtml(r.id)}')">
                            <span class="nd-ref-badge ${r.label}">${r.label}</span>
                            <span class="nd-ref-name" title="${escapeHtml(r.id)}">${escapeHtml(name)}</span>
                        </li>`;
                    }).join('')}</ul>`;
                } else {
                    refsHtml = `<p class="nd-empty">No call/import relationships found.</p>`;
                }
            } else {
                refsHtml = `<p class="nd-empty">Load a repo to see relationships.</p>`;
            }

            pane.innerHTML = `
                <div class="nd-breadcrumb">${breadcrumb}</div>
                <div class="nd-header">
                    <span class="nd-name">${escapeHtml(node.name)}</span>
                    <span class="nd-badge ${badgeCls}">${escapeHtml(node.type)}</span>
                </div>
                <div class="nd-tabs">
                    <div class="nd-tab active" onclick="switchTab(this,'nd-info')">Info</div>
                    <div class="nd-tab" onclick="switchTab(this,'nd-refs')">Refs</div>
                    <div class="nd-tab" onclick="switchTab(this,'nd-summary')">Summary</div>
                    ${(node.type === 'function' || node.type === 'method') ? `<div class="nd-tab" onclick="switchTab(this,'nd-explain');loadExplain('${escapeHtml(node.id)}')">Explain</div>` : ''}
                    ${node.type === 'class' ? `<div class="nd-tab" onclick="switchTab(this,'nd-explain-all')">Explain All</div>` : ''}
                </div>
                <div id="nd-info" class="nd-tab-panel active">${infoHtml}</div>
                <div id="nd-refs" class="nd-tab-panel">${refsHtml}</div>
                <div id="nd-summary" class="nd-tab-panel">${summaryHtml}</div>
                ${(node.type === 'function' || node.type === 'method') ? `<div id="nd-explain" class="nd-tab-panel"><p class="nd-empty">Click "Explain" tab to generate a code-level walkthrough.</p></div>` : ''}
                ${node.type === 'class' ? `<div id="nd-explain-all" class="nd-tab-panel">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                        <button class="explain-all-btn" onclick="loadExplainAll('${escapeHtml(node.id)}')">&#9654; Explain all methods</button>
                        <span id="explain-all-status" style="font-size:12px;color:#888;"></span>
                    </div>
                    <div id="explain-all-list"></div>
                </div>` : ''}
            `;

            // Show chat section and update context pill
            const chatSection = document.getElementById('chat-section');
            chatSection.style.display = 'flex';
            document.getElementById('chat-context-name').textContent = node.name;

            // Insert separator in thread if node changed
            const thread = document.getElementById('chat-thread');
            if (thread.children.length > 0) {
                const sep = document.createElement('div');
                sep.className = 'chat-separator';
                sep.textContent = `— now asking about: ${node.name} —`;
                thread.appendChild(sep);
                thread.scrollTop = thread.scrollHeight;
            }
        }

        function switchTab(tabEl, panelId) {
            const pane = document.getElementById('detail-pane');
            pane.querySelectorAll('.nd-tab').forEach(t => t.classList.remove('active'));
            pane.querySelectorAll('.nd-tab-panel').forEach(p => p.classList.remove('active'));
            tabEl.classList.add('active');
            document.getElementById(panelId).classList.add('active');
        }

        // ── Explain ───────────────────────────────────────────────────────────
        let _explainNodeId = null;

        async function loadExplain(nodeId, refresh = false) {
            const panel = document.getElementById('nd-explain');
            if (!panel) return;
            // Skip if already loaded for this node (unless forcing a refresh)
            if (!refresh && _explainNodeId === nodeId && panel.dataset.loaded === 'true') return;
            _explainNodeId = nodeId;
            panel.dataset.loaded = 'false';
            panel.innerHTML = `<p class="nd-empty" style="font-style:italic">${refresh ? 'Regenerating' : 'Loading'} explanation…</p>`;

            try {
                const url = `/api/explain/node/${encodeURIComponent(nodeId)}${refresh ? '?refresh=true' : ''}`;
                const resp = await fetch(url);
                if (!resp.ok) {
                    panel.innerHTML = `<p class="nd-empty" style="color:#c00">Error: ${resp.status} ${await resp.text()}</p>`;
                    return;
                }
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let markdown = '';
                panel.innerHTML = '<div class="nd-explain-toolbar"></div><div class="nd-explain-body"></div>';
                const body = panel.querySelector('.nd-explain-body');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    markdown += decoder.decode(value, { stream: true });
                    body.innerHTML = renderMd(markdown);
                    if (window.hljs) body.querySelectorAll('pre code:not(.language-mermaid)').forEach(b => hljs.highlightElement(b));
                }
                // Render mermaid diagrams now that full markdown is received
                await renderExplainMermaid(body);
                panel.dataset.loaded = 'true';
                // Cached-served indicator + regenerate control
                panel.querySelector('.nd-explain-toolbar').innerHTML =
                    `<span class="nd-cache-tag">⚡ cached locally</span>
                     <button class="nd-regen-btn" onclick="loadExplain('${escapeHtml(nodeId)}', true)">↻ Regenerate</button>`;
            } catch (e) {
                panel.innerHTML = `<p class="nd-empty" style="color:#c00">Failed to load explanation: ${e.message}</p>`;
            }
        }

        async function renderExplainMermaid(container) {
            const mermaidBlocks = container.querySelectorAll('pre code.language-mermaid');
            for (const block of mermaidBlocks) {
                const definition = block.textContent;
                const pre = block.parentElement;
                const wrapper = document.createElement('div');
                wrapper.className = 'nd-mermaid-wrap';
                try {
                    const id = 'explain-mermaid-' + Date.now() + '-' + Math.random().toString(36).slice(2);
                    const { svg } = await mermaid.render(id, definition);
                    wrapper.innerHTML = svg + '<span class="nd-mermaid-zoom-hint">click to zoom</span>';
                    wrapper.onclick = () => openMermaidModal(svg);
                } catch (err) {
                    wrapper.innerHTML = `<pre style="color:#c00;font-size:11px">Mermaid error: ${escapeHtml(err.message)}</pre>`;
                }
                pre.replaceWith(wrapper);
            }
        }

        // ── Explain All (class) ───────────────────────────────────────────────
        let _explainAllClassId = null;

        async function loadExplainAll(classNodeId) {
            if (_explainAllClassId === classNodeId) return; // already running or done
            _explainAllClassId = classNodeId;

            const list = document.getElementById('explain-all-list');
            const status = document.getElementById('explain-all-status');
            if (!list || !status) return;

            list.innerHTML = '';
            status.textContent = 'Loading…';

            const btn = document.querySelector('.explain-all-btn');
            if (btn) btn.disabled = true;

            try {
                const resp = await fetch(`/api/explain/class/${encodeURIComponent(classNodeId)}`);
                if (!resp.ok) {
                    status.textContent = `Error ${resp.status}`;
                    list.innerHTML = `<p class="nd-empty" style="color:#c00">${await resp.text()}</p>`;
                    return;
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                let done = false;
                let count = 0;

                while (!done) {
                    const { done: d, value } = await reader.read();
                    done = d;
                    buf += decoder.decode(value || new Uint8Array(), { stream: !done });

                    const lines = buf.split('\n');
                    buf = lines.pop(); // keep incomplete last line

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        let msg;
                        try { msg = JSON.parse(line); } catch { continue; }

                        if (msg.status === 'complete') {
                            status.textContent = `✓ ${count} method${count !== 1 ? 's' : ''} explained`;
                            break;
                        }

                        count++;
                        status.textContent = `Explained ${count} method${count !== 1 ? 's' : ''}…`;

                        // Build accordion item
                        const item = document.createElement('div');
                        item.className = 'ea-item';
                        item.dataset.nodeId = msg.node_id;

                        const header = document.createElement('div');
                        header.className = 'ea-header';
                        header.innerHTML = `<span class="ea-toggle">▶</span><code class="ea-name">${escapeHtml(msg.name)}</code>`;
                        header.onclick = () => toggleAccordion(item);

                        const body = document.createElement('div');
                        body.className = 'ea-body nd-explain-body';
                        body.style.display = 'none';
                        body.innerHTML = renderMd(msg.markdown);

                        item.appendChild(header);
                        item.appendChild(body);
                        list.appendChild(item);

                        // Render mermaid inside this body
                        await renderExplainMermaid(body);
                        if (window.hljs) body.querySelectorAll('pre code:not(.language-mermaid)').forEach(b => hljs.highlightElement(b));
                    }
                }
            } catch (e) {
                status.textContent = 'Failed';
                list.innerHTML += `<p class="nd-empty" style="color:#c00">Error: ${e.message}</p>`;
            } finally {
                if (btn) btn.disabled = false;
                _explainAllClassId = null;
            }
        }

        function toggleAccordion(item) {
            const body = item.querySelector('.ea-body');
            const toggle = item.querySelector('.ea-toggle');
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            toggle.textContent = open ? '▶' : '▼';
        }

        // ── Chat ─────────────────────────────────────────────────────────────
        function renderMd(text) {
            return window.marked ? window.marked.parse(text) : escapeHtml(text);
        }

        function clearChat() {
            document.getElementById('chat-thread').innerHTML = '';
        }

        function quickAsk(text) {
            const ta = document.getElementById('chat-input');
            ta.value = text;
            chatSend();
        }

        // Auto-grow textarea
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chat-input').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
            document.getElementById('chat-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
            });
        });

        async function chatSend() {
            const ta = document.getElementById('chat-input');
            const question = ta.value.trim();
            if (!question || !currentNodeId) return;
            ta.value = '';
            ta.style.height = 'auto';

            const thread = document.getElementById('chat-thread');

            // User bubble
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-msg';
            userMsg.innerHTML = `<div class="chat-msg-label">You</div><div class="chat-bubble user">${escapeHtml(question)}</div>`;
            thread.appendChild(userMsg);
            thread.scrollTop = thread.scrollHeight;

            // AI bubble (streaming)
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-msg';
            const aiBubble = document.createElement('div');
            aiBubble.className = 'chat-bubble ai';
            aiBubble.innerHTML = '<span style="color:#aaa;font-size:12px;">Thinking…</span>';
            aiMsg.innerHTML = `<div class="chat-msg-label">Assistant</div>`;
            aiMsg.appendChild(aiBubble);
            thread.appendChild(aiMsg);
            thread.scrollTop = thread.scrollHeight;

            const decoder = new TextDecoder();
            try {
                const resp = await fetch(`/api/chat?question=${encodeURIComponent(question)}`);
                const reader = resp.body.getReader();
                let acc = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    acc += decoder.decode(value, { stream: true });
                    aiBubble.innerHTML = renderMd(acc) + '<span class="stream-cursor">▍</span>';
                    thread.scrollTop = thread.scrollHeight;
                }
                aiBubble.innerHTML = renderMd(acc);
                aiBubble.querySelectorAll('pre code:not(.hljs)').forEach(el => window.hljs && window.hljs.highlightElement(el));
                thread.scrollTop = thread.scrollHeight;
            } catch (e) {
                aiBubble.innerHTML = `<span style="color:red;">${escapeHtml(e.message)}</span>`;
            }
        }

        // ── Summarize ─────────────────────────────────────────────────────────
        async function summarizeAll() {
            if (!currentRepo) { alert("Please select a repository first"); return; }
            if (!confirm("Summarize all nodes? This may take a while...")) return;
            try {
                const resp = await fetch("/api/summarize", { method: "POST" });
                const reader = resp.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const line = new TextDecoder().decode(value).trim();
                    if (line) console.log("Progress:", JSON.parse(line));
                }
                alert("Summarization complete!");
                loadRepo(currentRepo);
            } catch (e) {
                console.error("Summarization error:", e);
                alert("Error: " + e.message);
            }
        }

        // ── Source code viewer ────────────────────────────────────────────────
        async function loadSourceCode(nodeId) {
            const viewer = document.getElementById("code-viewer");
            const label = document.getElementById("code-file-label");
            viewer.textContent = "Loading...";
            try {
                const resp = await fetch(`/api/source/${encodeURIComponent(nodeId)}`);
                if (!resp.ok) {
                    viewer.textContent = "Source not available for this node.";
                    label.textContent = "—";
                    return;
                }
                const data = await resp.json();
                label.textContent = data.file;
                renderSymbols(data.file);
                const lines = data.source.split("\n");
                viewer.innerHTML = lines.map((line, i) => {
                    const lineNum = i + 1;
                    const highlight = data.lineno && lineNum === data.lineno;
                    const cls = highlight ? "code-line code-highlight-line" : "code-line";
                    return `<span class="${cls}"><span class="code-line-num">${lineNum}</span>${escapeHtml(line)}</span>`;
                }).join("");
                if (data.lineno) {
                    const hl = viewer.querySelector(".code-highlight-line");
                    if (hl) hl.scrollIntoView({ block: "center" });
                }
            } catch (e) {
                viewer.textContent = "Error loading source.";
                label.textContent = "—";
            }
        }

        // ── Symbols panel ────────────────────────────────────────────────────
        function renderSymbols(filePath) {
            const body = document.getElementById("symbols-body");
            if (!currentGraph || !filePath) {
                body.innerHTML = '<p class="loading">No file loaded</p>';
                return;
            }

            const fileNodes = currentGraph.nodes.filter(n =>
                (n.type === "class" || n.type === "function") &&
                n.metadata && n.metadata.file === filePath
            );

            const classes  = fileNodes.filter(n => n.type === "class")
                                      .sort((a, b) => a.metadata.lineno - b.metadata.lineno);
            const methods  = fileNodes.filter(n => n.type === "function" && n.metadata.class);
            const topFuncs = fileNodes.filter(n => n.type === "function" && !n.metadata.class)
                                      .sort((a, b) => a.metadata.lineno - b.metadata.lineno);

            if (!classes.length && !topFuncs.length) {
                body.innerHTML = '<p class="loading">No symbols found</p>';
                return;
            }

            let html = '';

            if (classes.length) {
                html += '<div class="sym-section-label">Classes</div>';
                classes.forEach(cls => {
                    html += symRow(cls.id, 'cls', cls.name, cls.metadata.lineno);
                    const clsMethods = methods
                        .filter(m => m.metadata.class === cls.name)
                        .sort((a, b) => a.metadata.lineno - b.metadata.lineno);
                    if (clsMethods.length) {
                        html += '<div class="sym-children">';
                        clsMethods.forEach(m => { html += symRow(m.id, 'mth', m.name, m.metadata.lineno); });
                        html += '</div>';
                    }
                });
            }

            if (topFuncs.length) {
                html += '<div class="sym-section-label">Functions</div>';
                topFuncs.forEach(fn => { html += symRow(fn.id, 'fn', fn.name, fn.metadata.lineno); });
            }

            body.innerHTML = html;

            body.querySelectorAll('.sym-item').forEach(el => {
                el.addEventListener('click', () => selectNode(el.dataset.nodeId));
            });
        }

        function symRow(nodeId, kind, name, lineno) {
            const badge = kind === 'cls' ? 'C' : kind === 'mth' ? 'M' : 'ƒ';
            return `<div class="sym-item" data-node-id="${escapeHtml(nodeId)}">` +
                `<span class="sym-badge ${kind}">${badge}</span>` +
                `<span class="sym-name">${escapeHtml(name)}</span>` +
                `<span class="sym-line">${lineno}</span>` +
                `</div>`;
        }

        function highlightActiveSymbol(nodeId) {
            document.querySelectorAll('#symbols-body .sym-item').forEach(el => {
                el.classList.toggle('active', el.dataset.nodeId === nodeId);
            });
        }

        // ── Center panel tabs ─────────────────────────────────────────────────
        let _currentCenterTab = 'graph';

        function switchCenterTab(tab) {
            _currentCenterTab = tab;
            document.getElementById('tab-graph').classList.toggle('active', tab === 'graph');
            document.getElementById('tab-diagram').classList.toggle('active', tab === 'diagram');
            document.getElementById('graph-view').style.display = tab === 'graph' ? 'flex' : 'none';
            const mc = document.getElementById('mermaid-container');
            mc.classList.toggle('active', tab === 'diagram');
            if (tab === 'diagram' && currentRepo) loadMermaidDiagram();
            if (tab === 'graph') notifyGraphResize();
        }

        async function loadMermaidDiagram() {
            const placeholder = document.getElementById('mermaid-placeholder');
            const output = document.getElementById('mermaid-output');
            placeholder.style.display = 'block';
            placeholder.textContent = 'Generating diagram…';
            output.innerHTML = '';
            try {
                const resp = await fetch('/api/mermaid');
                if (!resp.ok) throw new Error('API error ' + resp.status);
                const data = await resp.json();
                placeholder.style.display = 'none';
                output.removeAttribute('data-processed');
                output.innerHTML = '';
                const { svg } = await mermaid.render('mermaid-svg-' + Date.now(), data.mermaid);
                output.innerHTML = svg;
            } catch (e) {
                placeholder.textContent = 'Error generating diagram: ' + e.message;
            }
        }

        // ── Utilities ─────────────────────────────────────────────────────────
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Filter toggles
        ["contains", "imports", "calls", "inherits"].forEach(filter => {
            document.getElementById(`filter-${filter}`).addEventListener("change", () => {
                if (currentGraph) renderGraph(currentGraph);
            });
        });

        // Repo selector
        document.getElementById("repo-select").addEventListener("change", (e) => {
            if (e.target.value) loadRepo(e.target.value);
        });

        // ── Mermaid zoom modal (pan + zoom canvas) ────────────────────────────
        let _mermaidZoom = 1, _panX = 0, _panY = 0;
        let _contentW = 0, _contentH = 0;

        function openMermaidModal(svgHtml) {
            const content = document.getElementById('mermaid-modal-content');
            content.innerHTML = svgHtml;
            const svg = content.querySelector('svg');
            if (svg) {
                // Keep intrinsic size; just remove the max-width cap so it renders full size.
                // (Don't strip width/height — inside a shrink-to-fit parent that collapses to 0.)
                svg.style.maxWidth = 'none';
                svg.style.display = 'block';
                // If mermaid only gave a viewBox (no width), derive an explicit size.
                if (!svg.getAttribute('width') && svg.viewBox && svg.viewBox.baseVal) {
                    const vb = svg.viewBox.baseVal;
                    if (vb.width) svg.setAttribute('width', vb.width);
                    if (vb.height) svg.setAttribute('height', vb.height);
                }
            }

            const modal = document.getElementById('mermaid-modal');
            modal.classList.add('open');

            // Measure once the modal is laid out, then fit + center the diagram.
            requestAnimationFrame(() => {
                const stage = document.getElementById('mermaid-modal-scroll');
                _contentW = content.offsetWidth;
                _contentH = content.offsetHeight;
                const vw = stage.clientWidth, vh = stage.clientHeight;

                // Fit-to-view zoom (never upscale past 100% on open)
                const fit = Math.min(vw / (_contentW || 1), vh / (_contentH || 1), 1);
                _mermaidZoom = fit > 0 ? fit : 1;

                // Center within the viewport
                _panX = (vw - _contentW * _mermaidZoom) / 2;
                _panY = (vh - _contentH * _mermaidZoom) / 2;
                applyMermaidTransform();
            });
        }

        function applyMermaidTransform() {
            const content = document.getElementById('mermaid-modal-content');
            content.style.transformOrigin = '0 0';
            // Snap translation to whole pixels so vector text stays crisp (no sub-pixel blur).
            content.style.transform = `translate(${Math.round(_panX)}px, ${Math.round(_panY)}px) scale(${_mermaidZoom})`;
            const lvl = document.getElementById('mermaid-zoom-level');
            if (lvl) lvl.textContent = Math.round(_mermaidZoom * 100) + '%';
        }

        // Zoom while keeping a given viewport point (default: center) fixed on screen.
        function zoomMermaidAt(newZoom, vpX, vpY) {
            newZoom = Math.min(4, Math.max(0.1, newZoom));
            // The content coordinate currently under (vpX, vpY) must stay there.
            _panX = vpX - (vpX - _panX) * (newZoom / _mermaidZoom);
            _panY = vpY - (vpY - _panY) * (newZoom / _mermaidZoom);
            _mermaidZoom = newZoom;
            applyMermaidTransform();
        }

        function zoomMermaid(delta) {
            const stage = document.getElementById('mermaid-modal-scroll');
            zoomMermaidAt(_mermaidZoom + delta, stage.clientWidth / 2, stage.clientHeight / 2);
        }

        function resetMermaidZoom() {
            const stage = document.getElementById('mermaid-modal-scroll');
            const vw = stage.clientWidth, vh = stage.clientHeight;
            const fit = Math.min(vw / (_contentW || 1), vh / (_contentH || 1), 1);
            _mermaidZoom = fit > 0 ? fit : 1;
            _panX = (vw - _contentW * _mermaidZoom) / 2;
            _panY = (vh - _contentH * _mermaidZoom) / 2;
            applyMermaidTransform();
        }

        function closeMermaidModal() {
            document.getElementById('mermaid-modal').classList.remove('open');
        }

        // ── Drag-to-pan & wheel-zoom ──────────────────────────────────────────
        function initMermaidPan() {
            const stage = document.getElementById('mermaid-modal-scroll');
            if (!stage) return;
            let dragging = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;

            stage.addEventListener('mousedown', e => {
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                startPanX = _panX; startPanY = _panY;
                stage.classList.add('grabbing');
                e.preventDefault();
            });
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                _panX = startPanX + (e.clientX - startX);
                _panY = startPanY + (e.clientY - startY);
                applyMermaidTransform();
            });
            window.addEventListener('mouseup', () => {
                dragging = false;
                stage.classList.remove('grabbing');
            });
            // Wheel to zoom toward the cursor
            stage.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = stage.getBoundingClientRect();
                const vpX = e.clientX - rect.left, vpY = e.clientY - rect.top;
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                zoomMermaidAt(_mermaidZoom * factor, vpX, vpY);
            }, { passive: false });
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMermaidModal(); });

        // Init
        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
        initResizers();
        loadRepos();
        // Modal markup lives after this script, so wire up pan/zoom once the DOM is ready.
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMermaidPan);
        } else {
            initMermaidPan();
        }
    </script>
<!-- Mermaid zoom modal -->
<div id="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div id="mermaid-modal-box">
        <div id="mermaid-modal-toolbar">
            <button onclick="zoomMermaid(-0.2)" title="Zoom out">&minus;</button>
            <span id="mermaid-zoom-level">100%</span>
            <button onclick="zoomMermaid(0.2)" title="Zoom in">+</button>
            <button onclick="resetMermaidZoom()" title="Reset">Reset</button>
            <button id="mermaid-modal-close" onclick="closeMermaidModal()" title="Close (Esc)">✕</button>
        </div>
        <div id="mermaid-modal-scroll">
            <div id="mermaid-modal-content"></div>
        </div>
    </div>
</div>
</body>
</html>
